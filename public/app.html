<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DropRadar App</title>
<meta name="theme-color" content="#3438F0">
<link rel="icon" href="/img/icon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Unbounded:wght@500;600;700&display=swap">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="appbar">
  <div class="wrap appbar-inner">
    <a class="brand" href="/app" aria-label="DropRadar releases">
      <img class="brand-mark" src="/img/logo-mark.svg" alt="" width="32" height="32">
      <span>DropRadar</span>
    </a>
    <div class="appbar-right" id="userbar" hidden>
      <span class="muted user-name" id="userName"></span>
      <button class="btn btn-ghost btn-sm" id="logoutBtn" type="button">Sign out</button>
    </div>
  </div>
</header>
<div id="demoBanner" class="demo-banner" hidden>
  <div class="wrap">You're viewing the demo account. Results and fans are sample data. <a href="#" id="demoSignup">Create your own account</a></div>
</div>
<main id="view" class="wrap view" aria-live="polite"></main>
<div id="toast" class="toast" role="status" hidden></div>
<script src="/js/app.js"></script>
</body>
</html>
